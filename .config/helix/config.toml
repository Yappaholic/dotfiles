theme = "carbonfox"

[editor]
line-number = "relative"
mouse = false
completion-timeout = 5

[editor.lsp]
display-messages = true
[editor.inline-diagnostics]
cursor-line = "error"
[editor.file-picker]
hidden = false
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"
[editor.statusline]
left = ["mode"]
center = ["file-name"]
right = ["diagnostics", "position", "file-type"]
separator = "|"
[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"
[keys.insert]
"C-o" = "completion"
